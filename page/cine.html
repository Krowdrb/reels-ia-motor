<!DOCTYPE html>
<html lang="es"><head><meta charset="utf-8">
<style>
@font-face{font-family:"CZ";src:url("assets/Cinzel.ttf");font-weight:400 900}
@font-face{font-family:"PF";src:url("assets/PlayfairItalic.ttf");font-style:italic;font-weight:400 900}
html,body{margin:0;background:#000;overflow:hidden}
#stage{position:relative;width:1080px;height:1920px;overflow:hidden;background:#000}
.full{position:absolute;inset:0}
.shot{position:absolute;inset:0;overflow:hidden}
.layer{position:absolute;left:-200px;top:-250px;width:1480px;height:2420px;transform-origin:740px 1210px}
.layer svg{position:absolute;inset:0}
#title{position:absolute;z-index:4;left:0;top:520px;width:1080px;text-align:center;pointer-events:none}
#title .t{font-family:"CZ";font-weight:800;font-size:92px;line-height:1.08;text-transform:uppercase;
  background:linear-gradient(180deg,#FFF6DD 0%,#F5D58A 45%,#D9A048 100%);-webkit-background-clip:text;background-clip:text;color:transparent;
  filter:drop-shadow(0 0 22px rgba(245,194,107,.55)) drop-shadow(0 6px 18px rgba(0,0,0,.75));padding:0 60px}
#title .s{font-family:"PF";font-style:italic;font-weight:500;font-size:46px;color:#FFF3DC;margin-top:26px;text-shadow:0 4px 16px rgba(0,0,0,.8)}
#title .rule{width:0;height:3px;margin:30px auto 0;background:linear-gradient(90deg,transparent,#F5C26B,transparent)}
#caps{position:absolute;z-index:5;left:0;top:1300px;width:1080px;height:300px;pointer-events:none}
#caps .w{display:inline-block;font-family:"CZ";font-weight:900;font-size:100px;line-height:1.08;text-transform:uppercase;margin:0 18px;color:#FFF8EC;
  -webkit-text-stroke:7px rgba(0,0,0,.55);paint-order:stroke fill;will-change:transform,filter,opacity}
#caps .k{background:linear-gradient(180deg,#FFF3C4 0%,#F7CF73 40%,#D98F3A 100%);-webkit-background-clip:text;background-clip:text;color:transparent;-webkit-text-stroke:0}
#caps .kw{display:inline-block;position:relative}
#vig{background:radial-gradient(ellipse at 50% 45%,rgba(0,0,0,0) 45%,rgba(0,0,0,.55) 100%)}
</style></head>
<body>
<div id="stage">
  <div id="world" class="full" style="z-index:0"></div>
  <div id="fx" class="full" style="z-index:1"></div>
  <div id="vig" class="full" style="z-index:2"></div>
  <div id="flash" class="full" style="opacity:0;z-index:3"></div>
  <div id="title"></div>
  <div id="caps"></div>
  <img id="grain" class="full" style="width:1080px;height:1920px;opacity:.07;mix-blend-mode:overlay;image-rendering:pixelated;z-index:6">
</div>
<script src="tl.js"></script>
<script>
// =================== utilidades ===================
const clamp=(x,a=0,b=1)=>Math.min(b,Math.max(a,x)), P=(t,s,d)=>clamp((t-s)/d), lerp=(a,b,k)=>a+(b-a)*k;
const eio=x=>x<.5?4*x*x*x:1-Math.pow(-2*x+2,3)/2, eo=x=>1-Math.pow(1-x,3);
const back=(x,c1=2)=>{const c3=c1+1;return x<=0?0:x>=1?1:1+c3*Math.pow(x-1,3)+c1*Math.pow(x-1,2)};
const rnd=s=>{const x=Math.sin(s*127.1+311.7)*43758.5453;return x-Math.floor(x)};
const hex=c=>[1,3,5].map(i=>parseInt(c.slice(i,i+2),16));
const mix=(a,b,k)=>'#'+hex(a).map((v,i)=>Math.round(lerp(v,hex(b)[i],clamp(k))).toString(16).padStart(2,'0')).join('');

// =================== ambientes (paletas) ===================
const MOODS={
  night:{top:'#060B1E',hor:'#2B3B6E',base:'#05070F',light:'#B9CCFF',glow:'#7F9CFF',sun:'moon',rays:.18,fog:'#5A6FA8'},
  dusk:{top:'#151634',hor:'#B8604E',base:'#0E0A16',light:'#FFC59A',glow:'#FF8A5C',sun:'sunlow',rays:.25,fog:'#8C5A6A'},
  dawn:{top:'#2C2C5A',hor:'#E9A79E',base:'#1E1830',light:'#FFE1C2',glow:'#FFB89A',sun:'sunrise',rays:.35,fog:'#C79AA6'},
  golden:{top:'#C9792E',hor:'#FFE3A3',base:'#3A200C',light:'#FFF4D2',glow:'#FFD27A',sun:'sun',rays:.6,fog:'#FFE0A8'},
  storm:{top:'#0C1018',hor:'#3A4658',base:'#05070A',light:'#DCE6FF',glow:'#8EA6D6',sun:'none',rays:.0,fog:'#4D5A70'},
  day:{top:'#4F8FC8',hor:'#D9EEF7',base:'#24331F',light:'#FFFFFF',glow:'#FFF2C4',sun:'sun',rays:.25,fog:'#E6F2F7'},
  holy:{top:'#2A1A08',hor:'#FFD98C',base:'#1A0F05',light:'#FFFBEA',glow:'#FFE7A6',sun:'none',rays:.85,fog:'#FFE9B8'},
};
const DEPTH={sky:{f:0,d:.04},far:{f:.32,d:.22},mid:{f:.6,d:.5},near:{f:.86,d:.85},front:{f:1,d:1.15}};
const GROUND={far:1380,mid:1520,near:1720,front:1980};

// =================== elementos (siluetas planas) ===================
function hillPath(seed,y,amp,w=1480){let d=`M-40 ${y}`;for(let x=-40;x<=w+40;x+=40){const v=Math.sin(x*.004+seed)*amp+Math.sin(x*.011+seed*2.3)*amp*.35;d+=` L${x} ${y+v}`}return d+` L${w+40} 2500 L-40 2500 Z`}
const EL={
  hills:(o,c)=>`<path d="${hillPath(o.seed||1,o.gy-40,o.amp||60)}" fill="${c}"/>`,
  dunes:(o,c)=>`<path d="${hillPath(o.seed||3,o.gy-30,o.amp||45)}" fill="${c}"/>`,
  ground:(o,c)=>`<rect x="-40" y="${o.gy}" width="1560" height="900" fill="${c}"/>`,
  mountain:(o,c)=>{const x=o.x,s=o.s;return `<path d="M${x-620*s} ${o.gy} C${x-380*s} ${o.gy-260*s} ${x-200*s} ${o.gy-640*s} ${x} ${o.gy-680*s} C${x+200*s} ${o.gy-640*s} ${x+380*s} ${o.gy-260*s} ${x+620*s} ${o.gy} Z" fill="${c}"/>`},
  calvary:(o,c)=>{const x=o.x,s=o.s,top=o.gy-330*s;const cr=(cx,h,w)=>`<rect x="${cx-9*s}" y="${top-h}" width="${18*s}" height="${h+20}" fill="${c}"/><rect x="${cx-w/2}" y="${top-h*.78}" width="${w}" height="${16*s}" fill="${c}"/>`;
    return `<path d="M${x-560*s} ${o.gy+40} C${x-300*s} ${o.gy-150*s} ${x-160*s} ${top} ${x} ${top} C${x+160*s} ${top} ${x+300*s} ${o.gy-150*s} ${x+560*s} ${o.gy+40} Z" fill="${c}"/>`+cr(x,260*s,140*s)+cr(x-150*s,190*s,110*s)+cr(x+150*s,190*s,110*s)},
  cross:(o,c,L)=>{const x=o.x,s=o.s,h=760*s,top=o.gy-h;const cloth=o.cloth?`<path class="cloth" d="M${x-170*s} ${top+170*s} C${x-60*s} ${top+230*s} ${x+60*s} ${top+230*s} ${x+170*s} ${top+170*s} L${x+150*s} ${top+420*s} C${x+110*s} ${top+300*s} ${x-110*s} ${top+300*s} ${x-150*s} ${top+420*s} Z" fill="${L.light}" opacity=".9"/>`:'';
    return `<rect x="${x-26*s}" y="${top}" width="${52*s}" height="${h+40}" fill="${c}"/><rect x="${x-210*s}" y="${top+150*s}" width="${420*s}" height="${46*s}" fill="${c}"/>`+cloth},
  tomb:(o,c,L)=>{const x=o.x,s=o.s,g=o.gy,dw=150*s,dh=240*s;const door=`M${x-dw/2} ${g} L${x-dw/2} ${g-dh+dw/2} A${dw/2} ${dw/2} 0 0 1 ${x+dw/2} ${g-dh+dw/2} L${x+dw/2} ${g} Z`;
    const inner=o.open?`<path d="${door}" fill="${o.lit?L.light:'#000'}" opacity="${o.lit?.95:.85}"/>`+(o.lit?`<rect x="${x-dw*.35}" y="${g-40*s}" width="${dw*.7}" height="${22*s}" rx="${8*s}" fill="#FFFFFF" opacity=".85"/>`:''):`<path d="${door}" fill="#000" opacity=".9"/>`;
    const stone=o.open?`<circle cx="${x+dw*1.25}" cy="${g-dw*.62}" r="${dw*.66}" fill="${mix(c,'#000000',.25)}"/>`:`<circle cx="${x+dw*.1}" cy="${g-dw*.62}" r="${dw*.68}" fill="${mix(c,'#000000',.25)}"/>`;
    return `<path d="M${x-420*s} ${g} C${x-400*s} ${g-330*s} ${x-200*s} ${g-430*s} ${x} ${g-430*s} C${x+200*s} ${g-430*s} ${x+400*s} ${g-330*s} ${x+420*s} ${g} Z" fill="${c}"/>`+inner+stone},
  olive:(o,c)=>{const x=o.x,s=o.s,g=o.gy;return `<path d="M${x-10*s} ${g} C${x-30*s} ${g-120*s} ${x+20*s} ${g-180*s} ${x-10*s} ${g-260*s} L${x+18*s} ${g-260*s} C${x+40*s} ${g-170*s} ${x+10*s} ${g-110*s} ${x+26*s} ${g} Z" fill="${c}"/>`+
    [[-90,-300,110],[40,-340,120],[120,-270,90],[-20,-400,100],[-140,-240,70]].map(([dx,dy,r])=>`<circle cx="${x+dx*s}" cy="${g+dy*s}" r="${r*s}" fill="${c}"/>`).join('')},
  palm:(o,c)=>{const x=o.x,s=o.s,g=o.gy,tx=x+60*s,ty=g-520*s;return `<path d="M${x} ${g} C${x+10*s} ${g-200*s} ${x+30*s} ${g-400*s} ${tx} ${ty} L${tx+16*s} ${ty+6*s} C${x+50*s} ${g-400*s} ${x+30*s} ${g-200*s} ${x+26*s} ${g} Z" fill="${c}"/>`+
    [-150,-100,-40,20,80,140].map((a,i)=>{const r=a*Math.PI/180,l=(200+30*(i%2))*s;return `<path d="M${tx} ${ty} Q${tx+Math.cos(r-.5)*l*.6} ${ty+Math.sin(r-.5)*l*.6-60*s} ${tx+Math.cos(r)*l} ${ty+Math.sin(r)*l+50*s} Q${tx+Math.cos(r-.3)*l*.5} ${ty+Math.sin(r-.3)*l*.5} ${tx} ${ty} Z" fill="${c}"/>`}).join('')},
  cypress:(o,c)=>`<ellipse cx="${o.x}" cy="${o.gy-260*o.s}" rx="${60*o.s}" ry="${270*o.s}" fill="${c}"/>`,
  city:(o,c)=>{const x=o.x,s=o.s,g=o.gy;let d=`<rect x="${x-560*s}" y="${g-160*s}" width="${1120*s}" height="${200*s}" fill="${c}"/>`;
    [-500,-330,-120,90,300,480].forEach((dx,i)=>{const w=(70+(i%3)*25)*s,h=(260+(i*97)%160)*s;d+=`<rect x="${x+dx*s-w/2}" y="${g-h}" width="${w}" height="${h}" fill="${c}"/>`+(i%2?`<circle cx="${x+dx*s}" cy="${g-h}" r="${w*.55}" fill="${c}"/>`:`<path d="M${x+dx*s-w/2} ${g-h} L${x+dx*s} ${g-h-70*s} L${x+dx*s+w/2} ${g-h} Z" fill="${c}"/>`)});return d},
  temple:(o,c)=>{const x=o.x,s=o.s,g=o.gy;let d=`<rect x="${x-330*s}" y="${g-40*s}" width="${660*s}" height="${60*s}" fill="${c}"/><rect x="${x-300*s}" y="${g-80*s}" width="${600*s}" height="${44*s}" fill="${c}"/><path d="M${x-330*s} ${g-420*s} L${x} ${g-560*s} L${x+330*s} ${g-420*s} Z" fill="${c}"/><rect x="${x-330*s}" y="${g-440*s}" width="${660*s}" height="${40*s}" fill="${c}"/>`;
    for(let i=0;i<6;i++)d+=`<rect x="${x-270*s+i*108*s-18*s}" y="${g-400*s}" width="${36*s}" height="${320*s}" fill="${c}"/>`;return d},
  sea:(o,c,L,t)=>{let d='';for(let i=0;i<5;i++){const y=o.gy+i*70;d+=`<path d="${hillPath(i*1.7+(t||0)*.6*(i%2?1:-1),y,18+i*4)}" fill="${mix(c,L.light,.08*(4-i))}"/>`}return d},
  boat:(o,c,L,t)=>{const x=o.x,s=o.s,g=o.gy+Math.sin((t||0)*1.8)*14*s,r=Math.sin((t||0)*1.3)*3;return `<g transform="rotate(${r} ${x} ${g})"><path d="M${x-260*s} ${g-60*s} L${x+260*s} ${g-60*s} L${x+180*s} ${g+40*s} L${x-180*s} ${g+40*s} Z" fill="${c}"/><rect x="${x-8*s}" y="${g-420*s}" width="${16*s}" height="${370*s}" fill="${c}"/><path d="M${x+12*s} ${g-400*s} Q${x+200*s} ${g-250*s} ${x+12*s} ${g-90*s} Z" fill="${c}"/></g>`},
  tent:(o,c)=>`<path d="M${o.x-200*o.s} ${o.gy} L${o.x} ${o.gy-260*o.s} L${o.x+200*o.s} ${o.gy} Z" fill="${c}"/><path d="M${o.x-30*o.s} ${o.gy} L${o.x} ${o.gy-120*o.s} L${o.x+30*o.s} ${o.gy} Z" fill="#000" opacity=".5"/>`,
  well:(o,c)=>`<rect x="${o.x-110*o.s}" y="${o.gy-120*o.s}" width="${220*o.s}" height="${120*o.s}" rx="${20*o.s}" fill="${c}"/><rect x="${o.x-100*o.s}" y="${o.gy-300*o.s}" width="${14*o.s}" height="${190*o.s}" fill="${c}"/><rect x="${o.x+86*o.s}" y="${o.gy-300*o.s}" width="${14*o.s}" height="${190*o.s}" fill="${c}"/><rect x="${o.x-120*o.s}" y="${o.gy-310*o.s}" width="${240*o.s}" height="${18*o.s}" fill="${c}"/>`,
  sheep:(o,c)=>[0,1,2,3].map(i=>{const x=o.x+(i-1.5)*120*o.s+rnd(i)*30,y=o.gy-10;return `<ellipse cx="${x}" cy="${y-40*o.s}" rx="${55*o.s}" ry="${38*o.s}" fill="${c}"/><circle cx="${x+50*o.s}" cy="${y-60*o.s}" r="${20*o.s}" fill="${c}"/>`}).join(''),
  rocks:(o,c)=>[0,1,2].map(i=>`<ellipse cx="${o.x+(i-1)*160*o.s}" cy="${o.gy-20*o.s}" rx="${(90-i*20)*o.s}" ry="${(50-i*8)*o.s}" fill="${c}"/>`).join(''),
  throne:(o,c,L)=>`<rect x="${o.x-150*o.s}" y="${o.gy-520*o.s}" width="${300*o.s}" height="${520*o.s}" rx="${30*o.s}" fill="${c}"/><circle cx="${o.x}" cy="${o.gy-560*o.s}" r="${60*o.s}" fill="${L.light}" opacity=".85"/>`,
  ark:(o,c)=>`<rect x="${o.x-420*o.s}" y="${o.gy-220*o.s}" width="${840*o.s}" height="${180*o.s}" fill="${c}"/><path d="M${o.x-480*o.s} ${o.gy-40*o.s} L${o.x+480*o.s} ${o.gy-40*o.s} L${o.x+400*o.s} ${o.gy+60*o.s} L${o.x-400*o.s} ${o.gy+60*o.s} Z" fill="${c}"/><path d="M${o.x-300*o.s} ${o.gy-220*o.s} L${o.x} ${o.gy-360*o.s} L${o.x+300*o.s} ${o.gy-220*o.s} Z" fill="${c}"/>`,
  manger:(o,c,L)=>`<path d="M${o.x-160*o.s} ${o.gy-140*o.s} L${o.x+160*o.s} ${o.gy-140*o.s} L${o.x+110*o.s} ${o.gy-40*o.s} L${o.x-110*o.s} ${o.gy-40*o.s} Z" fill="${c}"/><path d="M${o.x-120*o.s} ${o.gy} L${o.x-90*o.s} ${o.gy-140*o.s} M${o.x+120*o.s} ${o.gy} L${o.x+90*o.s} ${o.gy-140*o.s}" stroke="${c}" stroke-width="${16*o.s}"/><ellipse cx="${o.x}" cy="${o.gy-150*o.s}" rx="${70*o.s}" ry="${26*o.s}" fill="${L.light}" opacity=".95"/>`,
  star:(o,c,L)=>{const x=o.x,y=o.y||420,s=o.s;return `<path d="M${x} ${y-60*s} L${x+14*s} ${y-14*s} L${x+60*s} ${y} L${x+14*s} ${y+14*s} L${x} ${y+60*s} L${x-14*s} ${y+14*s} L${x-60*s} ${y} L${x-14*s} ${y-14*s} Z" fill="${L.light}"/>`},
};
// figuras humanas en silueta (opcionalmente iluminadas)
function figure(f,c,L,t){
  const s=f.s,x=f.x,g=f.gy,lit=f.lit,sway=Math.sin(t*1.2+x*.01)*1.5;
  const robe=lit?(f.robe||'#F7F1E3'):c, skin=lit?(f.skin||'#C99A72'):c, hair=lit?(f.hair||'#4A2E1A'):c;
  let H=420*s, kneel=f.pose==='kneel', bow=f.pose==='bow'||f.pose==='mourn';
  if(kneel)H*=.66; if(f.who==='child')H*=.62;
  const top=g-H, hr=34*s*(f.who==='child'?.85:1), hx=x+(bow?18*s:0), hy=top+hr+(bow?26*s:0);
  let d=`<g transform="skewX(${sway}) translate(${Math.tan(-sway*Math.PI/180)*g},0)">`;
  // túnica
  d+=`<path d="M${x-70*s} ${top+hr*2.1} C${x-110*s} ${top+H*.45} ${x-(kneel?160:120)*s} ${g-(kneel?20:60)*s} ${x-(kneel?170:110)*s} ${g} L${x+(kneel?170:110)*s} ${g} C${x+(kneel?160:120)*s} ${g-(kneel?20:60)*s} ${x+110*s} ${top+H*.45} ${x+70*s} ${top+hr*2.1} Z" fill="${robe}"/>`;
  if(lit&&f.sash)d+=`<path d="M${x-62*s} ${top+hr*2.4} L${x+40*s} ${top+H*.62} L${x+70*s} ${top+H*.58} L${x-30*s} ${top+hr*2.2} Z" fill="${f.sash}"/>`;
  // brazos
  if(f.pose==='arms')d+=`<path d="M${x-60*s} ${top+hr*2.6} L${x-150*s} ${top-40*s} L${x-122*s} ${top-52*s} L${x-36*s} ${top+hr*2.4} Z M${x+60*s} ${top+hr*2.6} L${x+150*s} ${top-40*s} L${x+122*s} ${top-52*s} L${x+36*s} ${top+hr*2.4} Z" fill="${robe}"/>`;
  if(f.pose==='open')d+=`<path d="M${x-60*s} ${top+hr*2.5} L${x-200*s} ${top+hr*3.6} L${x-195*s} ${top+hr*4.2} L${x-50*s} ${top+hr*3.3} Z M${x+60*s} ${top+hr*2.5} L${x+200*s} ${top+hr*3.6} L${x+195*s} ${top+hr*4.2} L${x+50*s} ${top+hr*3.3} Z" fill="${robe}"/>`;
  if(f.pose==='point')d+=`<path d="M${x+50*s} ${top+hr*2.6} L${x+230*s} ${top+hr*2.2} L${x+232*s} ${top+hr*2.7} L${x+50*s} ${top+hr*3.3} Z" fill="${robe}"/>`;
  if(f.pose==='pray')d+=`<path d="M${x-30*s} ${top+hr*3.4} L${x} ${top+hr*2.6} L${x+30*s} ${top+hr*3.4} Z" fill="${mix(robe,'#000000',.15)}"/>`;
  // accesorios
  if(f.who==='shepherd'||f.staff)d+=`<path d="M${x+120*s} ${g} L${x+120*s} ${top-20*s} C${x+120*s} ${top-80*s} ${x+60*s} ${top-80*s} ${x+70*s} ${top-30*s}" stroke="${c}" stroke-width="${12*s}" fill="none"/>`;
  if(f.who==='soldier')d+=`<path d="M${x+110*s} ${g} L${x+110*s} ${top-120*s}" stroke="${c}" stroke-width="${10*s}"/><path d="M${x+98*s} ${top-120*s} L${x+110*s} ${top-170*s} L${x+122*s} ${top-120*s} Z" fill="${c}"/><circle cx="${x-90*s}" cy="${top+H*.5}" r="${60*s}" fill="${c}"/>`;
  if(f.jar)d+=`<path d="M${hx+40*s} ${hy-hr*1.1} C${hx+10*s} ${hy-hr*1.6} ${hx+10*s} ${hy-hr*2.6} ${hx+50*s} ${hy-hr*2.7} C${hx+90*s} ${hy-hr*2.6} ${hx+90*s} ${hy-hr*1.6} ${hx+60*s} ${hy-hr*1.1} Z" fill="${c}"/>`;
  // cabeza, pelo/velo, barba, rostro sereno
  if(f.veil||f.who==='woman')d+=`<path d="M${hx-hr*1.25} ${hy+hr*1.8} C${hx-hr*1.5} ${hy-hr*.6} ${hx-hr} ${hy-hr*1.35} ${hx} ${hy-hr*1.35} C${hx+hr} ${hy-hr*1.35} ${hx+hr*1.5} ${hy-hr*.6} ${hx+hr*1.25} ${hy+hr*1.8} Z" fill="${lit?(f.veilColor||'#7FA3C8'):c}"/>`;
  else if(f.who==='jesus'||f.longhair)d+=`<path d="M${hx-hr*1.15} ${hy+hr*1.4} C${hx-hr*1.3} ${hy-hr*.4} ${hx-hr*.9} ${hy-hr*1.2} ${hx} ${hy-hr*1.2} C${hx+hr*.9} ${hy-hr*1.2} ${hx+hr*1.3} ${hy-hr*.4} ${hx+hr*1.15} ${hy+hr*1.4} Z" fill="${hair}"/>`;
  d+=`<ellipse cx="${hx}" cy="${hy}" rx="${hr*.86}" ry="${hr}" fill="${skin}"/>`;
  if(f.who==='jesus'||f.beard)d+=`<path d="M${hx-hr*.8} ${hy+hr*.1} C${hx-hr*.7} ${hy+hr*1.3} ${hx+hr*.7} ${hy+hr*1.3} ${hx+hr*.8} ${hy+hr*.1} C${hx+hr*.4} ${hy+hr*.6} ${hx-hr*.4} ${hy+hr*.6} ${hx-hr*.8} ${hy+hr*.1} Z" fill="${hair}"/>`;

  if(lit&&f.face!==false)d+=`<path d="M${hx-hr*.42} ${hy-hr*.02} q${hr*.16} ${hr*.12} ${hr*.32} 0 M${hx+hr*.1} ${hy-hr*.02} q${hr*.16} ${hr*.12} ${hr*.32} 0" stroke="#3A2414" stroke-width="${3*s}" fill="none" stroke-linecap="round"/>`;

function crowd(o,c,L,t){let d='';const n=o.n||5;for(let i=0;i<n;i++){const k=i/(n-1)-.5;d+=figure({x:o.x+k*o.s*130*n/2.2,gy:o.gy+((i%2)*14),s:o.s*(.85+rnd(i+o.x)*.25),pose:o.pose||(i%3?'stand':'bow'),who:i%3===1?'woman':'robed'},c,L,t)}return d}

// =================== construcción de planos ===================
const world=document.getElementById('world'),fxEl=document.getElementById('fx'),flash=document.getElementById('flash'),titleEl=document.getElementById('title'),capsEl=document.getElementById('caps'),grain=document.getElementById('grain');
const SHOTS=[];
const DEF={hills:'mid',dunes:'mid',ground:'near',mountain:'far',calvary:'mid',cross:'near',tomb:'near',olive:'mid',palm:'mid',cypress:'mid',city:'far',temple:'mid',sea:'near',boat:'near',tent:'mid',well:'near',sheep:'near',rocks:'front',throne:'near',ark:'mid',manger:'near',star:'sky'};
function norm(it){if(typeof it==='string'){const [n,...fl]=it.split(':');return {el:n,flags:fl}}return Object.assign({flags:[]},it)}
function buildShot(sc,sh,idx){
  const L=MOODS[sh.mood||sc.mood||'night'];
  const div=document.createElement('div');div.className='shot';world.appendChild(div);
  const layers={};
  for(const k of ['sky','far','mid','near','front']){const l=document.createElement('div');l.className='layer';div.appendChild(l);layers[k]=l}
  // cielo
  const sunKind=L.sun, lx=(sh.light&&sh.light.x!=null?sh.light.x:.62)*1480, ly=(sh.light&&sh.light.y!=null?sh.light.y:.36)*2420;
  let sky=`<svg viewBox="0 0 1480 2420" width="1480" height="2420"><defs><linearGradient id="g${idx}" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="${L.top}"/><stop offset=".62" stop-color="${L.hor}"/><stop offset="1" stop-color="${mix(L.hor,L.base,.4)}"/></linearGradient>
    <radialGradient id="r${idx}"><stop offset="0" stop-color="${L.glow}" stop-opacity=".9"/><stop offset=".35" stop-color="${L.glow}" stop-opacity=".35"/><stop offset="1" stop-color="${L.glow}" stop-opacity="0"/></radialGradient></defs>
    <rect width="1480" height="2420" fill="url(#g${idx})"/>`;
  if(['night','storm','dusk','dawn'].includes(sh.mood||sc.mood)){for(let i=0;i<70;i++)sky+=`<circle class="tw" cx="${rnd(i*3+idx)*1480}" cy="${rnd(i*7+idx)*1100}" r="${1+rnd(i)*2.4}" fill="#fff" opacity="${(sh.mood||sc.mood)==='night'?.8:.35}"/>`}
  sky+=`<circle cx="${lx}" cy="${ly}" r="620" fill="url(#r${idx})"/>`;
  if(sunKind==='moon')sky+=`<circle cx="${lx}" cy="${ly}" r="70" fill="#F4F1E6"/>`;
  if(sunKind==='sun'||sunKind==='sunrise'||sunKind==='sunlow')sky+=`<circle cx="${lx}" cy="${ly}" r="${sunKind==='sun'?90:120}" fill="${L.light}" opacity=".95"/>`;
  sky+=`<g class="clouds">${[0,1,2].map(i=>`<ellipse cx="${300+i*420}" cy="${520+i*170}" rx="${260+i*40}" ry="${46+i*8}" fill="${mix(L.hor,L.top,.5)}" opacity=".45"/>`).join('')}</g></svg>`;
  layers.sky.innerHTML=sky;

  set.forEach((e,i)=>{const depth=e.depth||DEF[e.el]||'mid';if(depth==='sky'){layers.sky.querySelector('svg').insertAdjacentHTML('beforeend','');}
    (bucket[depth]||bucket.mid).push(e)});

      (['sea','boat'].includes(e.el)?dyn:stat).push(o)});
    let svgS=`<svg viewBox="0 0 1480 2420" width="1480" height="2420">`+stat.map(o=>(EL[o.el]||EL.hills)(o,col,L,0)).join('')+`</svg>`;
    layers[k].innerHTML=svgS+`<svg class="dyn" viewBox="0 0 1480 2420" width="1480" height="2420"></svg><svg class="chars" viewBox="0 0 1480 2420" width="1480" height="2420"></svg>`;
    const cs=chars.filter(c=>(c.depth||'near')===k).map(c=>Object.assign({},c,{x:(c.x!=null?c.x:.5)*1480,gy:gy+(c.dy||0),s:(c.s||1)*({far:.45,mid:.7,near:1,front:1.35}[k])}));
    dynamic.push({k,col,dyn,cs,svgDyn:layers[k].querySelector('.dyn'),svgCh:layers[k].querySelector('.chars')});
  }
  // efectos
  const fx=(sh.fx||sc.fx||[]);
  const fxDiv=document.createElement('div');fxDiv.className='full';fxDiv.style.mixBlendMode='screen';div.appendChild(fxDiv);
  const raysOn=fx.includes('rays')||L.rays>.5;
  let fxs=`<svg viewBox="0 0 1080 1920" width="1080" height="1920" style="position:absolute;inset:0"><defs><linearGradient id="ray${idx}" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="${L.light}" stop-opacity=".55"/><stop offset="1" stop-color="${L.light}" stop-opacity="0"/></linearGradient>
    <filter id="bl${idx}"><feGaussianBlur stdDeviation="30"/></filter></defs>`;
  if(raysOn)fxs+=`<g class="rays" opacity="${Math.max(.35,L.rays)}">`+[...Array(9)].map((_,i)=>{const a=-60+i*15+rnd(i+idx)*8,w=3+rnd(i)*5;return `<path d="M0 0 L${Math.tan((a-w/2)*Math.PI/180)*2600} 2600 L${Math.tan((a+w/2)*Math.PI/180)*2600} 2600 Z" fill="url(#ray${idx})" opacity="${.35+rnd(i*5)*.5}"/>`}).join('')+`</g>`;
  if(fx.includes('fog')||(sh.mood||sc.mood)==='dawn')fxs+=`<g class="fog" filter="url(#bl${idx})">${[0,1,2].map(i=>`<ellipse cx="${200+i*400}" cy="${1350+i*120}" rx="520" ry="${80+i*20}" fill="${L.fog}" opacity=".45"/>`).join('')}</g>`;
  fxs+=`<g class="dust">${[...Array(fx.includes('dust')||raysOn?70:25)].map((_,i)=>`<circle r="${1.5+rnd(i*9+idx)*3.5}" fill="${L.light}"/>`).join('')}</g>`;
  if(fx.includes('rain')||(sh.mood||sc.mood)==='storm')fxs+=`<g class="rain" opacity=".35">${[...Array(90)].map((_,i)=>`<path d="M0 0 l-14 70" stroke="#C8D6F0" stroke-width="2.5"/>`).join('')}</g>`;

  fxDiv.innerHTML=fxs;

}
const CAM={push:[1,1.17,0,0,0,0],pull:[1.17,1,0,0,0,0],panL:[1.1,1.1,150,-150,0,0],panR:[1.1,1.1,-150,150,0,0],tiltDown:[1.1,1.1,0,0,-200,60],tiltUp:[1.1,1.1,0,0,120,-160],still:[1.05,1.08,0,0,0,0],rise:[1.2,1.05,0,0,180,-40]};
function updateShot(S,t,tl){
  const p=eio(clamp(tl));const c=CAM[S.sh.cam||S.sc.cam||'push']||CAM.push;
  const z=lerp(c[0],c[1],p),cx=lerp(c[2],c[3],p)+Math.sin(t*.7)*6,cy=lerp(c[4],c[5],p)+Math.cos(t*.5)*5;
  const fxp=S.sh.focus||{x:.5,y:.55};
  for(const k of ['sky','far','mid','near','front']){const d=DEPTH[k].d,sc=1+(z-1)*(.25+.75*d);
    S.layers[k].style.transformOrigin=`${fxp.x*1480}px ${fxp.y*2420}px`;
    S.layers[k].style.transform=`translate(${cx*d}px,${cy*d}px) scale(${sc})`}
  S.layers.sky.querySelectorAll('.tw').forEach((e,i)=>{if(i%3===0)e.setAttribute('opacity',(.3+.5*Math.abs(Math.sin(t*1.5+i))).toFixed(2))});
  const cl=S.layers.sky.querySelector('.clouds');if(cl)cl.setAttribute('transform',`translate(${(t*12)%200-100},0)`);
  for(const D of S.dynamic){
    if(D.dyn.length)D.svgDyn.innerHTML=D.dyn.map(o=>(EL[o.el])(o,D.col,S.L,t)).join('');
    if(D.cs.length)D.svgCh.innerHTML=D.cs.map(f=>{const app=f.at!=null?f.at:0;const k=P(t-S.t0,app,.6);if(k<=0)return '';
      const g=f.glow||f.lit?`<circle cx="${f.x}" cy="${f.gy-200*f.s}" r="${300*f.s*(1+.04*Math.sin(t*2))}" fill="${S.L.glow}" opacity="${.35*k}" filter="url(#bl0)"/>`:'';
      return `<g opacity="${k}">`+g+(f.who==='crowd'||f.who==='mourners'?crowd(f,D.col,S.L,t):figure(f,D.col,S.L,t))+`</g>`}).join('');
  }

  if(r){const sx=(S.lx+cx*.04)*1080/1080,sy=S.ly;r.setAttribute('transform',`translate(${S.lx+cx*.1},${S.ly-150}) rotate(${Math.sin(t*.25)*4})`);r.style.opacity=(Math.max(.35,S.L.rays)*(0.75+.25*Math.sin(t*1.1)))}
  const fg=S.fxDiv.querySelector('.fog');if(fg)fg.setAttribute('transform',`translate(${Math.sin(t*.15)*120},0)`);
  S.fxDiv.querySelectorAll('.dust circle').forEach((e,i)=>{const sp=10+rnd(i)*30,x=(rnd(i*3)*1080+Math.sin(t*.4+i)*40),y=(1920-((t*sp+rnd(i*5)*1920)%1920));e.setAttribute('cx',x.toFixed(1));e.setAttribute('cy',y.toFixed(1));e.setAttribute('opacity',(.25+.6*Math.abs(Math.sin(t*1.7+i))).toFixed(2))});
  const rn=S.fxDiv.querySelector('.rain');if(rn)[...rn.children].forEach((e,i)=>{const y=((t*1400+rnd(i)*1920)%2000)-80,x=rnd(i*7)*1180;e.setAttribute('transform',`translate(${x},${y})`)});
  // relámpagos (eventos o al azar en tormenta)

  if(S.mood==='storm')for(let k=0;k<8;k++)evs.push(S.t0+1.3+k*2.7+rnd(k)*.8);
  for(const te of evs){const d=t-te;if(d>=0&&d<.35){lf=Math.max(lf,d<.06?1:d<.12?.3:d<.18?.8:1-(d-.18)/.17)}}
  if(lf>0){let x=200+rnd(Math.floor(t))*680,y=0,pth=`M${x} ${y}`;for(let k=0;k<8;k++){x+=(rnd(k+Math.floor(t*3))-.5)*160;y+=120;pth+=` L${x} ${y}`}bolt.setAttribute('d',pth);bolt.setAttribute('opacity',lf)}else bolt.setAttribute('opacity',0);
  return lf;
}

// =================== línea de tiempo de planos ===================
function buildAll(){
  TL.scenes.forEach((sc,si)=>{(sc.shots||[{}]).forEach((sh,j)=>{const S=buildShot(sc,sh,SHOTS.length);S.t0=sc.s+(sh.t||0);S.trans=sh.trans||(j===0?(sc.trans||'fade'):'fade');S.climax=sc.climax;SHOTS.push(S)})});
  SHOTS.forEach((S,i)=>{S.t1=i+1<SHOTS.length?SHOTS[i+1].t0:TL.total;S.div.style.display='none'});
  if(TL.title_card){const tc=TL.title_card;titleEl.innerHTML=`<div class="t">${tc.text||''}</div>${tc.sub?`<div class="s">${tc.sub}</div>`:''}<div class="rule"></div>`}
}
const TD={fade:.7,flare:.9,cut:.001,dip:1.0};
// =================== subtítulos dinámicos ===================
let capKey='';
function renderCaps(t,mood){
  const cap=TL.caps.find(c=>t>=c.s-0.05&&t<c.e+0.12);
  if(!cap){capsEl.innerHTML='';capKey='';return}
  if(capKey!==String(cap.s)){capKey=String(cap.s);
    capsEl.innerHTML='<div class="row" style="position:absolute;left:540px;top:0;white-space:nowrap;transform-origin:0 50%">'+cap.words.map(w=>`<span class="w ${w.key?'k':''}">${w.w.replace(/[.,:;*]$/g,'').replace(/\*/g,'')}</span>`).join('')+'</div>';
    const row=capsEl.firstChild,wd=row.offsetWidth,k=Math.min(1,960/wd);row.dataset.k=k;row.dataset.w=wd}
  const row=capsEl.firstChild,k=+row.dataset.k,wd=+row.dataset.w;
  const out=P(t,cap.e,.12);
  row.style.transform=`translateX(${-wd*k/2}px) scale(${k})`;row.style.opacity=1-out;
  const glowC={night:'rgba(160,190,255,.75)',storm:'rgba(170,190,230,.7)',dusk:'rgba(255,170,120,.6)',dawn:'rgba(255,200,180,.6)',golden:'rgba(255,214,122,.8)',day:'rgba(255,240,200,.5)',holy:'rgba(255,231,166,.9)'}[mood]||'rgba(255,214,122,.6)';
  [...row.children].forEach((sp,i)=>{const w=cap.words[i];const a=P(t,w.s-.06,.22),e=eo(a);
    let sc=lerp(1.35,1,e),blur=(1-e)*14,y=(1-e)*26,rot=0;
    if(w.key){const q=P(t,w.s,.45);sc*=1+.22*Math.sin(Math.PI*clamp(q*1.4))*(1-q*.3);
      if(mood==='storm')rot=Math.sin(t*40)*1.5*(1-q);
      sp.style.backgroundSize='300% 100%';sp.style.backgroundImage=`linear-gradient(100deg,#F7CF73 0%,#FFF8DE ${lerp(-20,120,P(t,w.s,.8))}%,#F7CF73 ${lerp(10,150,P(t,w.s,.8))}%),linear-gradient(180deg,#FFF3C4,#F7CF73 40%,#D98F3A)`;
      sp.style.filter=`blur(${blur}px) drop-shadow(0 0 ${18+10*Math.sin(t*3)}px rgba(245,194,107,.85)) drop-shadow(0 6px 14px rgba(0,0,0,.8))`}
    else sp.style.filter=`blur(${blur}px) drop-shadow(0 0 16px ${glowC}) drop-shadow(0 6px 14px rgba(0,0,0,.85))`;
    sp.style.opacity=a;sp.style.transform=`translateY(${y}px) scale(${sc}) rotate(${rot}deg)`});
}
// =================== fotograma ===================
const grainSrc=[...Array(8)].map((_,i)=>`assets/grain/g${i}.png`);
window.renderFrame=function(t){
  let i=SHOTS.findIndex(S=>t>=S.t0&&t<S.t1);if(i<0)i=SHOTS.length-1;
  const S=SHOTS[i],td=TD[S.trans]||.7,inT=t-S.t0;
  SHOTS.forEach((x,j)=>{x.div.style.display=(j===i||(j===i-1&&inT<td))?'block':'none'});
  const lf=updateShot(S,t,(t-S.t0)/(S.t1-S.t0));
  S.div.style.opacity=1;S.div.style.zIndex=2;
  let fl=0;
  if(i>0&&inT<td){const Pv=SHOTS[i-1];updateShot(Pv,t,(t-Pv.t0)/(Pv.t1-Pv.t0));Pv.div.style.zIndex=1;Pv.div.style.opacity=1;
    const k=inT/td;
    if(S.trans==='flare'){S.div.style.opacity=eo(clamp((k-.35)/.5));fl=Math.sin(Math.PI*k)}
    else if(S.trans==='dip'){Pv.div.style.opacity=1-clamp(k*2);S.div.style.opacity=clamp(k*2-1)}
    else S.div.style.opacity=eio(k)}
  // destello (transición o relámpago); al cierre de un clímax, luz dorada
  const fc=S.trans==='flare'?S.L.light:'#FFFFFF';
  const lfo=Math.max(fl*.9,lf*.55);
  flash.style.background=`radial-gradient(circle at ${S.lx/1480*100}% ${S.ly/2420*100}%, ${fc} 0%, ${fc}cc 30%, ${fc}00 75%)`;flash.style.opacity=lfo;
  // título (solo al inicio)
  if(TL.title_card){const a=P(t,.15,.9),o=1-P(t,(TL.title_card.dur||3.2),.7),ls=lerp(.32,.12,eo(P(t,.15,2.4)));
    titleEl.style.opacity=Math.min(eo(a),o);titleEl.querySelector('.t').style.letterSpacing=ls+'em';titleEl.style.transform=`scale(${lerp(1.06,1,eo(a))})`;
    const r=titleEl.querySelector('.rule');if(r)r.style.width=(eo(P(t,.6,1.2))*520)+'px';
    titleEl.style.display=o<=0?'none':'block'}
  if(window.NOCAPS){capsEl.innerHTML="";capKey=""}else renderCaps(t,S.mood);
  grain.src=grainSrc[Math.floor(t*30)%8];
  return true;
};
window.ready=Promise.all([document.fonts.load('900 80px CZ'),document.fonts.load('italic 500 40px PF')]).then(()=>document.fonts.ready).then(()=>{buildAll();
  // filtro de desenfoque compartido para halos de personajes
  const s=document.createElementNS('http://www.w3.org/2000/svg','svg');s.setAttribute('width',0);s.setAttribute('height',0);s.style.position='absolute';s.innerHTML='<filter id="bl0" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="40"/></filter>';document.body.appendChild(s);
  return Promise.all(grainSrc.map(src=>new Promise(r=>{const im=new Image();im.onload=r;im.onerror=r;im.src=src})))});
</script>
